<style>
/* Phone build: the app fills the whole screen. On a wider screen it sits in a centred, phone-width column. */
:root{
  --font-ui:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  /* App tokens. The product is light by design, so these never switch with the system theme. */
  --a-bg:#FFF8FA; --a-surface:#FFFFFF; --a-ink:#22161D; --a-ink2:#55464E; --a-muted:#76666F;
  --a-line:#F1E3E9; --a-line2:#E6D3DB; --a-fill:#F8F1F4;
  --a-pink:#F49DBB; --a-pink2:#EC7FA4; --a-pink-ink:#A8325F; --a-pink-soft:#FFE9F1; --a-pink-tint:#FFF5F8; --a-on-pink:#2A0F1C;
  --a-danger:#CF3149; --a-danger-soft:#FFEEF0; --a-danger-line:#F6CED5;
  --a-ok:#2A8257; --a-ok-soft:#E7F4EC; --a-warn:#9E620F; --a-warn-soft:#FFF3DF; --a-warn-line:#F2DDB5;
  --a-t2:#0098CD; --a-bus:#00A3DB; --a-nightsafe:#2B5DE8; --a-nightsafe-soft:#EDF2FF; --a-white:#FFFFFF; --a-scrim:rgba(34,22,29,.42);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--a-bg);overscroll-behavior:none}
body{color:var(--a-ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--a-pink-ink);outline-offset:2px}
#device{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:440px;transform:translateX(-50%);overflow:hidden;background:var(--a-bg)}
@media (min-width:600px){html,body{background:#F3ECEF}#device{box-shadow:0 0 0 1px #EBDDE3,0 30px 80px -30px rgba(60,20,40,.3)}}

/* ---------- app: screen frame ---------- */
.screen{position:relative;width:100%;height:100%;flex:none;background:var(--a-bg);color:var(--a-ink);font-family:var(--font-ui);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;font-size:15px;line-height:1.4}
.backdrop{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 150px);mask-image:linear-gradient(to bottom,transparent 0,#000 150px)}
.blob{position:absolute;border-radius:50%}
.blob-top{width:340px;height:340px;right:-140px;top:-40px;background:radial-gradient(circle,rgba(246,168,198,.55),rgba(246,168,198,0) 68%)}
.blob-bottom{width:380px;height:380px;left:-190px;bottom:-120px;background:radial-gradient(circle,rgba(244,180,205,.5),rgba(244,180,205,0) 68%)}
.safe-top{position:relative;z-index:2;flex:none;height:calc(var(--safe-t) + 12px)}
.screen-body{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:4px 20px 36px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen-body::-webkit-scrollbar{display:none}
.screen-body > *,.sheet > *{flex-shrink:0}

.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}
.ic-lg{width:26px;height:26px}

/* header */
.app-header{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
.h-title{flex:1;min-width:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.h-title small{display:block;font-size:12.5px;font-weight:600;color:var(--a-muted);letter-spacing:0}
.brand{flex:1;display:flex;align-items:center;gap:10px;color:var(--a-ink)}
.brand-mark{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:0 5px 12px -5px rgba(196,70,122,.55)}
/* logo */
.logo-tile{position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(150deg,#F49AB9 0%,#DE6994 55%,#C4467A 100%)}
.logo-tile::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 14%,rgba(255,255,255,.3),rgba(255,255,255,0) 62%)}
.logo-tile .mark{position:relative;display:block;width:100%;height:100%}
.wordmark{display:block;height:21px;width:auto;color:var(--a-ink)}
.wordmark .tittle{fill:#D9578A}
.icon-btn{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--a-surface);border:1px solid var(--a-line);color:var(--a-ink)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--a-pink-soft);color:var(--a-pink-ink);font-size:15px;font-weight:800}
.avatar-sm{width:34px;height:34px;font-size:13.5px}
.avatar-lg{width:58px;height:58px;font-size:22px}
.avatar.alt{background:var(--a-fill);color:var(--a-ink2);box-shadow:inset 0 0 0 1px var(--a-line2)}

/* type */
.display{margin:0;font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--a-ink2);font-size:15px;line-height:1.45}
.lede strong{color:var(--a-ink)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.group-label{margin:0 4px;font-size:13px;font-weight:700;color:var(--a-muted)}
.muted{color:var(--a-muted);font-size:13.5px}
.link{color:var(--a-pink-ink);font-size:14px;font-weight:800}
.link.danger{color:var(--a-danger)}
.note{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:12.5px;line-height:1.45;color:var(--a-muted)}
.note .ic{width:15px;height:15px;margin-top:1px}

/* buttons */
.btn{width:100%;height:52px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:-.01em;text-align:center}
.btn-primary{background:linear-gradient(180deg,var(--a-pink),var(--a-pink2));color:var(--a-on-pink);box-shadow:0 6px 14px -8px rgba(196,70,122,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-secondary{background:var(--a-surface);border:1px solid var(--a-line2);color:var(--a-ink)}
.btn-danger-soft{height:46px;background:var(--a-danger-soft);border:1px solid var(--a-danger-line);color:var(--a-danger);font-size:15px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;min-width:0;height:48px;padding:0 10px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn-sm{height:38px;padding:0 18px;width:auto;font-size:14px}
.action-bar{position:relative;z-index:2;flex:none;display:flex;flex-direction:column;gap:10px;padding:12px 20px calc(var(--safe-b) + 16px);background:linear-gradient(to top,var(--a-bg) 72%,rgba(255,248,250,0))}
.action-bar.with-tabs{padding-bottom:30px}

/* cards & tags */
.card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:22px;box-shadow:0 1px 2px rgba(80,30,50,.04),0 12px 30px -16px rgba(120,40,75,.22)}
.tag-row{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--a-fill);color:var(--a-ink2);font-size:12.5px;font-weight:700;white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.ok{background:var(--a-ok-soft);color:var(--a-ok)}
.tag.warn{background:var(--a-warn-soft);color:var(--a-warn)}
.tag.danger{background:var(--a-danger-soft);color:var(--a-danger)}
.crowd-bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.crowd-bars i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.25}
.crowd-bars i:nth-child(1){height:5px}.crowd-bars i:nth-child(2){height:7px}.crowd-bars i:nth-child(3){height:9.5px}.crowd-bars i:nth-child(4){height:12px}
.crowd-bars i.on{opacity:1}
.line-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;color:var(--a-white);font-size:12px;font-weight:800;letter-spacing:.02em}
.line-badge.t2{background:var(--a-t2)}
.line-badge.bus{background:var(--a-bus)}

/* home */
.search-field{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;border-radius:18px;background:var(--a-surface);border:1px solid var(--a-line2);color:var(--a-muted);font-size:16px;font-weight:600;box-shadow:0 10px 26px -18px rgba(120,40,75,.35)}
.search-field .ic{color:var(--a-pink-ink)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:-6px}
.place-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 12px;border-radius:999px;background:var(--a-surface);border:1px solid var(--a-line);font-size:13.5px;font-weight:700}
.place-chip span{font-weight:500;color:var(--a-muted)}
.place-chip .ic{width:16px;height:16px;color:var(--a-pink-ink)}
.card-trip{display:flex;flex-direction:column;overflow:hidden}
.map{display:block;width:100%;height:auto}
.trip-body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.trip-top{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.trip-times{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big-time{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.status-line{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--a-warn-soft);border:1px solid var(--a-warn-line);width:100%}
.status-line > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.status-line strong{font-size:14.5px}
.status-line span{font-size:12.5px;color:var(--a-ink2)}
.status-line.ok{background:var(--a-ok-soft);border-color:#CDE8D8}
.status-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--a-warn);box-shadow:0 0 0 4px rgba(158,98,15,.14)}
.status-line.ok .status-dot{background:var(--a-ok);box-shadow:0 0 0 4px rgba(42,130,87,.14)}

/* plan */
.od-card{padding:4px 16px}
.od-row{display:flex;align-items:center;gap:14px;min-height:58px}
.od-row > div{flex:1;min-width:0}
.od-row label{display:block;font-size:12px;font-weight:700;color:var(--a-muted)}
.od-row strong{font-size:15.5px}
.od-dot{width:12px;height:12px;flex:none;border-radius:50%;border:3px solid var(--a-pink2)}
.od-dot.to{background:var(--a-pink2);border-radius:4px}
.od-divider{height:1px;margin-left:26px;background:var(--a-line)}
.pref{display:flex;flex-direction:column;gap:10px}
.seg-chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--a-line2);background:var(--a-surface);color:var(--a-ink2);font-size:14px;font-weight:700}
.pchip.on{background:var(--a-ink);border-color:var(--a-ink);color:var(--a-white)}
.route-list{display:flex;flex-direction:column;gap:12px}
.route-card{display:flex;flex-direction:column;gap:12px;padding:16px;width:100%}
.route-card.best{border:1.5px solid #EFB0C7;background:linear-gradient(180deg,var(--a-surface),var(--a-pink-tint))}
.rc-flag{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--a-pink-soft);color:var(--a-pink-ink);font-size:12px;font-weight:800}
.rc-flag .ic{width:13px;height:13px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rc-modes{display:flex;align-items:center;gap:5px;color:var(--a-muted)}
.rc-modes .ic{width:17px;height:17px}
.rc-modes .ic-sep{width:12px;height:12px;opacity:.6}
.rc-time{text-align:right}
.rc-time strong{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.rc-time span{font-size:12.5px;color:var(--a-muted);font-variant-numeric:tabular-nums}

/* route detail */
.route-summary{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 2px}
.eyebrow{display:block;font-size:12.5px;font-weight:700;color:var(--a-muted)}
.display-sm{display:block;font-size:38px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rs-meta{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--a-ink2)}
.legs-card{padding:18px 16px 4px}
.legs{display:flex;flex-direction:column}
.leg{position:relative;display:flex;gap:12px;padding-bottom:18px}
.leg-rail{position:absolute;left:13px;top:30px;bottom:2px;width:2px;border-radius:1px;background:var(--a-line2)}
.leg:last-child .leg-rail{display:none}
.leg-ic{position:relative;z-index:1;width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--a-surface);border:1px solid var(--a-line2);color:var(--a-ink2)}
.leg-ic .ic{width:15px;height:15px}
.leg.ride .leg-ic{background:var(--a-t2);border-color:var(--a-t2);color:var(--a-white)}
.leg.end .leg-ic{background:var(--a-pink2);border-color:var(--a-pink2);color:var(--a-white)}
.leg.done .leg-ic{background:var(--a-fill);color:var(--a-muted)}
.leg-main{flex:1;min-width:0;padding-top:3px}
.leg-title{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:800}
.leg-title span{font-weight:600;color:var(--a-muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.leg-sub{margin-top:2px;font-size:13px;color:var(--a-muted);line-height:1.45}
.leg.done .leg-title{color:var(--a-muted)}
.train{margin-top:12px}
.train-ends{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11.5px;font-weight:700;color:var(--a-muted)}
.cars{display:flex;gap:4px}
.car{position:relative;flex:1;min-width:0;height:46px;border-radius:8px;background:var(--a-surface);border:1px solid var(--a-line2);overflow:hidden;display:flex;justify-content:center}
.car-fill,.cars-legend i::after{position:absolute;left:0;right:0;bottom:0;background:#7E6A75}
.l1.car-fill,.cars-legend i.l1::after{height:22%;opacity:.2}
.l2.car-fill,.cars-legend i.l2::after{height:46%;opacity:.3}
.l3.car-fill,.cars-legend i.l3::after{height:72%;opacity:.42}
.l4.car-fill,.cars-legend i.l4::after{height:100%;opacity:.56}
.car-n{position:relative;margin-top:5px;font-size:12px;font-weight:800;color:var(--a-ink);font-variant-numeric:tabular-nums}
.car.pick{border:2px solid var(--a-pink2)}
.car.pick .car-n{color:var(--a-pink-ink)}
.car .light{position:absolute;bottom:5px;left:50%;margin-left:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--a-nightsafe);box-shadow:0 0 0 2px rgba(43,93,232,.18)}
.cars-legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;margin-top:8px;font-size:11.5px;font-weight:600;color:var(--a-muted)}
.cars-legend span{display:inline-flex;align-items:center;gap:5px}
.cars-legend i{position:relative;width:10px;height:13px;border-radius:3px;border:1px solid var(--a-line2);background:var(--a-surface);overflow:hidden}
.cars-legend i::after{content:""}
.car-tip{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--a-fill);color:var(--a-ink2);font-size:13px;line-height:1.4}
.car-tip strong{color:var(--a-ink)}
.car-tip i{width:9px;height:9px;flex:none;margin-top:4px;border-radius:50%;background:var(--a-nightsafe);box-shadow:0 0 0 3px rgba(43,93,232,.15)}
.share-row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%}
.share-row > div{flex:1;min-width:0}
.share-row strong{display:block;font-size:15px}
.share-row span{font-size:13px;color:var(--a-muted)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:5;background:var(--a-scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:10px 20px calc(var(--safe-b) + 24px);border-radius:30px 30px 0 0;background:var(--a-surface);box-shadow:0 -12px 40px rgba(60,20,40,.22);scrollbar-width:none}
.sheet-grab{flex:none;width:40px;height:5px;margin:0 auto 4px;border-radius:3px;background:var(--a-line2)}
.sheet-title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet-sub{margin:-6px 0 0;font-size:14px;line-height:1.45;color:var(--a-ink2)}
.contact-list{display:flex;flex-direction:column;gap:8px}
.contact-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--a-line)}
.contact-row > div{flex:1;min-width:0}
.contact-row strong{display:block;font-size:15px}
.contact-row span{font-size:12.5px;color:var(--a-muted)}
.contact-row.on{border-color:#EFB0C7;background:var(--a-pink-tint)}
.radio{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--a-line2);display:grid;place-items:center;color:var(--a-white)}
.contact-row.on .radio{border:0;background:var(--a-pink2)}
.radio .ic{width:13px;height:13px;stroke-width:3}
.contact-row.add{border-style:dashed;color:var(--a-pink-ink);font-weight:800}
.add-ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--a-pink-soft)}
.see-card{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;background:var(--a-fill)}
.see-card h3{margin:0;font-size:14px;font-weight:800}
.check-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.check-list li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--a-ink2)}
.check-list .ic{width:16px;height:16px;color:var(--a-ok)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px;border-radius:18px;border:1px solid var(--a-line);background:var(--a-surface)}
.opt.rec{border-color:#EFB0C7;background:var(--a-pink-tint)}
.opt > div{flex:1;min-width:0}
.opt strong{display:block;font-size:15px}
.opt span{display:block;margin-top:2px;font-size:13px;line-height:1.4;color:var(--a-muted)}
.opt .opt-meta{color:var(--a-ink2);font-weight:700}
.opt-ic{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--a-pink-soft);color:var(--a-pink-ink)}

/* live trip */
.now-card{display:flex;flex-direction:column;padding:18px;border-radius:26px;background:linear-gradient(160deg,var(--a-surface) 30%,var(--a-pink-soft));border:1px solid #F4D2DF;box-shadow:0 14px 34px -18px rgba(168,50,95,.45)}
.now-top{display:flex;align-items:center;justify-content:space-between}
.live-pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:var(--a-ok-soft);color:var(--a-ok);font-size:12.5px;font-weight:800}
.live-pill i{width:8px;height:8px;border-radius:50%;background:var(--a-ok);animation:pulse 1.8s ease-out infinite}
.live-pill.wait{background:var(--a-warn-soft);color:var(--a-warn)}
.live-pill.wait i{background:var(--a-warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,130,87,.5)}100%{box-shadow:0 0 0 8px rgba(42,130,87,0)}}
.now-title{margin:12px 0 4px;font-size:25px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.now-sub{margin:0;font-size:14px;color:var(--a-ink2)}
.progress{height:6px;margin-top:16px;border-radius:3px;background:#F3D9E3;overflow:hidden}
.progress span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--a-pink),var(--a-pink2))}
.progress-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;font-weight:600;color:var(--a-muted)}
.share-status{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--a-surface);border:1px solid var(--a-line)}
.share-status > div{flex:1;min-width:0}
.share-status strong{display:block;font-size:14.5px}
.share-status span{font-size:12.5px;color:var(--a-muted)}
.share-actions{display:flex;gap:14px}
.share-status.off{background:var(--a-fill)}
.checkin{display:flex;flex-direction:column;gap:12px;padding:16px}
.checkin-head{display:flex;gap:12px;align-items:flex-start}
.checkin-head > div{flex:1}
.checkin-head strong{display:block;font-size:16px;letter-spacing:-.01em}
.checkin-head span{font-size:12.5px;color:var(--a-muted)}
.checkin-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--a-pink-soft);color:var(--a-pink-ink)}
.checkin-done{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:var(--a-ok-soft);color:var(--a-ok);font-size:14px;font-weight:700}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--a-surface);border:1px solid var(--a-line);font-size:13.5px;color:var(--a-ink2)}
.banner .ic{color:var(--a-pink-ink)}
.ask-card{display:flex;flex-direction:column;gap:12px;padding:16px}
.ask-card p{margin:0;font-size:14px;color:var(--a-ink2);line-height:1.45}

/* help */
.loc-card{display:flex;flex-direction:column;gap:10px;padding:16px}
.loc-top{display:flex;gap:10px;align-items:flex-start}
.loc-top .ic{color:var(--a-pink-ink);margin-top:1px}
.loc-top strong{display:block;font-size:15.5px}
.loc-top span{font-size:13px;color:var(--a-muted)}
.loc-code{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:var(--a-fill)}
.loc-code b{font-size:22px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.loc-code span{font-size:12px;color:var(--a-muted);display:block}
.hold-btn{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;overflow:hidden;width:100%;height:76px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:26px;background:var(--a-danger);color:var(--a-white);font-size:19px;font-weight:800;letter-spacing:-.01em;box-shadow:0 14px 28px -12px rgba(207,49,73,.75);touch-action:none;user-select:none;-webkit-user-select:none}
.hold-fill{position:absolute;top:0;bottom:0;left:0;width:0;background:rgba(80,0,15,.28)}
.hold-btn.holding .hold-fill{width:100%;transition:width 1.5s linear}
.hold-btn.demo .hold-fill{width:38%}
.hold-label{position:relative;display:flex;align-items:center;gap:10px}
.hold-caption{margin:-8px 0 0;text-align:center;font-size:12.5px;color:var(--a-muted)}
.divider-label{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--a-muted)}
.divider-label i{flex:1;height:1px;background:var(--a-line2)}
.list-card{display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-top:1px solid var(--a-line)}
.row:first-child{border-top:0}
.row > div{flex:1;min-width:0}
.row strong{display:block;font-size:15px}
.row span{font-size:12.5px;color:var(--a-muted)}
.row .value{flex:none;font-size:14px;font-weight:600;color:var(--a-muted)}
.row-ic{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--a-pink-soft);color:var(--a-pink-ink)}
.row-ic.danger{background:var(--a-danger-soft);color:var(--a-danger)}
.row-ic.neutral{background:var(--a-fill);color:var(--a-ink2)}
.row .chev{color:var(--a-muted)}
.toggle{position:relative;width:46px;height:28px;flex:none;border-radius:999px;background:#E3D6DC}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--a-white);box-shadow:0 1px 3px rgba(0,0,0,.22)}
.toggle.on{background:var(--a-ok)}
.toggle.on i{left:21px}

/* reports */
.map-card{position:relative;overflow:hidden;padding:0}
.map-legend{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.map-legend span{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,.92);font-size:11.5px;font-weight:700;color:var(--a-ink2)}
.map-legend i{width:8px;height:8px;border-radius:50%}
.report-card{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.rep-head{display:flex;gap:12px;align-items:flex-start}
.rep-head > div{flex:1;min-width:0}
.rep-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--a-danger-soft);color:var(--a-danger)}
.rep-ic.warn{background:var(--a-warn-soft);color:var(--a-warn)}
.rep-head strong{display:block;font-size:15px;line-height:1.3}
.rep-head span{font-size:12.5px;color:var(--a-muted)}
.report-card.fading .rep-ic{opacity:.55}
.rep-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--a-ink2)}
.rep-meta em{font-style:normal;color:var(--a-muted);white-space:nowrap}
.decay{flex:1;height:5px;border-radius:3px;background:#F0E5EA;overflow:hidden}
.decay span{display:block;height:100%;border-radius:3px}
.rep-actions{display:flex;gap:8px}
.mini-btn{flex:1;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--a-line2);background:var(--a-surface);font-size:13.5px;font-weight:800;text-align:center}
.mini-btn .ic{width:15px;height:15px}
.rep-confirm{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--a-ok-soft);color:var(--a-ok);font-size:13px;font-weight:700}
.rep-confirm .ic{width:16px;height:16px}
.ctx-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.ctx-card > div{flex:1;min-width:0}
.ctx-card strong{display:block;font-size:15px}
.ctx-card span{font-size:12.5px;color:var(--a-muted)}
.field-label{margin:0;font-size:15px;font-weight:800}
.field-label small{font-weight:600;color:var(--a-muted);font-size:13px}
.situations{display:flex;flex-wrap:wrap;gap:8px}
.sit{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--a-line2);background:var(--a-surface);font-size:14px;font-weight:700;color:var(--a-ink2)}
.sit .ic{width:15px;height:15px}
.sit.on{background:var(--a-pink-soft);border-color:var(--a-pink2);color:var(--a-pink-ink)}
.textarea{display:block;width:100%;min-height:86px;resize:none;padding:12px 14px;border-radius:16px;border:1px solid var(--a-line2);background:var(--a-surface);font:inherit;font-size:16px;line-height:1.45;color:var(--a-ink)}
.textarea::placeholder{color:var(--a-muted)}
.explain{display:flex;gap:12px;padding:14px 16px;border-radius:18px;background:var(--a-pink-tint);border:1px solid var(--a-line)}
.explain .ic{color:var(--a-pink-ink);margin-top:1px}
.explain ul{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.4;color:var(--a-ink2)}
.explain strong{color:var(--a-ink)}
.explain > div{flex:1;min-width:0}
.explain > div > strong{display:block;font-size:14px}
.explain p{margin:3px 0 0;font-size:13px;line-height:1.45;color:var(--a-ink2)}

/* done / onboarding */
.done-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 8px 6px;text-align:center}
.done-ic{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:var(--a-ok-soft);color:var(--a-ok);box-shadow:0 0 0 12px rgba(42,130,87,.07)}
.done-ic .ic{width:40px;height:40px;stroke-width:2.4}
.done-hero h1{margin:14px 0 0}
.done-hero p{margin:0;max-width:300px;font-size:15px;line-height:1.45;color:var(--a-ink2)}
.ob-art{display:flex;justify-content:center;padding-top:8px}
.ob-art svg{display:block;width:250px;height:auto}
.feature-list{display:flex;flex-direction:column;gap:16px}
.feature{display:flex;gap:14px;align-items:flex-start}
.feature > div{flex:1}
.feature strong{display:block;font-size:15.5px}
.feature span{font-size:13.5px;line-height:1.45;color:var(--a-ink2)}
.f-ic{width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--a-pink-soft);color:var(--a-pink-ink)}
.f-ic.danger{background:var(--a-danger-soft);color:var(--a-danger)}

/* tour */
.tour{position:absolute;inset:0;z-index:20}
.tour-ring{position:absolute;border-radius:20px;box-shadow:0 0 0 9999px rgba(28,17,23,.62);outline:2px solid var(--a-white);outline-offset:3px}
.tour-card{position:absolute;width:min(318px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;border-radius:22px;background:var(--a-surface);box-shadow:0 22px 44px rgba(0,0,0,.28)}
.tour-step{font-size:12px;font-weight:800;color:var(--a-pink-ink)}
.tour-card h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.tour-card p{margin:0;font-size:13.5px;line-height:1.45;color:var(--a-ink2)}
.tour-actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:6px;height:6px;border-radius:3px;background:var(--a-line2)}
.tour-dots i.on{width:18px;background:var(--a-pink2)}
.tour-skip{font-size:14px;font-weight:700;color:var(--a-muted)}

/* profile & forms */
.profile-card{display:flex;align-items:center;gap:14px;padding:16px}
.profile-card > div{flex:1}
.profile-card strong{display:block;font-size:18px;letter-spacing:-.02em}
.profile-card span{font-size:13px;color:var(--a-muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:800}
.input{height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--a-line2);background:var(--a-surface);font:inherit;font-size:16px;color:var(--a-ink)}
.input:focus,.textarea:focus{outline:2px solid var(--a-pink2);outline-offset:0;border-color:transparent}

/* recipient view */
.mum-map{position:relative;overflow:hidden;padding:0}
.eta-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}
.eta-card strong{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.eta-card span{font-size:13px;color:var(--a-muted)}

/* toast */
.toast{position:absolute;z-index:30;left:16px;right:16px;bottom:calc(var(--safe-b) + 102px);display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;background:var(--a-ink);color:var(--a-white);font-size:14px;font-weight:700;line-height:1.35;box-shadow:0 16px 36px -10px rgba(0,0,0,.4);animation:toastIn .25s ease-out}
.toast .ic{color:#9FE0BC}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* tab bar */
.tab-bar{position:relative;z-index:2;flex:none;display:flex;justify-content:space-around;padding:8px 6px calc(var(--safe-b) + 10px);background:rgba(255,255,255,.94);border-top:1px solid var(--a-line)}
.tab{display:flex;flex:1;min-width:0;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--a-muted);text-align:center}
.tab-ic{width:48px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab.on{color:var(--a-pink-ink)}
.tab.on .tab-ic{background:var(--a-pink-soft)}
.tab-safety{margin-top:-24px}
.safety-fab{width:56px;height:56px;margin-bottom:1px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--a-pink),var(--a-pink2));color:var(--a-on-pink);box-shadow:0 0 0 5px var(--a-white),0 10px 20px -6px rgba(196,70,122,.55)}
.safety-fab .ic{width:25px;height:25px;stroke-width:2.1}
.tab-safety.on .safety-fab{background:linear-gradient(180deg,var(--a-pink2),#D45F8C)}
/* splash */
.splash{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 0 70px;text-align:center}
.splash-logo{width:108px;height:108px;border-radius:29px;box-shadow:0 22px 44px -18px rgba(196,70,122,.6);animation:splashIn .8s cubic-bezier(.2,.8,.2,1) both}
.splash-wm{margin-top:26px;animation:fadeUp .7s .18s cubic-bezier(.2,.8,.2,1) both}
.splash-wm .wordmark{height:46px}
.splash-tag{margin-top:12px;font-size:15px;font-weight:600;color:var(--a-muted);animation:fadeUp .7s .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function header(o){
  o = o || {};
  const left = o.brand
    ? `<div class="brand"><span class="brand-mark logo-tile">${MARK}</span>${WORDMARK}</div>`
    : `<button type="button" class="icon-btn back-btn" data-go="${o.back}" aria-label="Back">${I('left')}</button><div class="h-title">${o.title}${o.sub ? `<small>${o.sub}</small>` : ''}</div>`;
  return `<header class="app-header">${left}</header>`;
}
function titleHeader(title, sub){
  return `<header class="app-header"><div class="h-title">${title}${sub ? `<small>${sub}</small>` : ''}</div></header>`;
}

function tabBar(active, st){
  const tabs = [['home','Home','home','home'],['trip','Trip','route', st.tripActive ? 'trip' : 'plan'],['safety','Safety','shield','help'],['report','Report','flag','report'],['profile','Profile','user','profile']];
  return `<nav class="tab-bar" aria-label="Main">${tabs.map(t => t[0] === 'safety'
    ? `<button type="button" class="tab tab-safety${active === 'safety' ? ' on' : ''}" data-tab="safety" data-go="help"${active === 'safety' ? ' aria-current="page"' : ''}><span class="safety-fab">${I('shield')}</span>Safety</button>`
    : `<button type="button" class="tab${t[0] === active ? ' on' : ''}" data-tab="${t[0]}" data-go="${t[3]}"${t[0] === active ? ' aria-current="page"' : ''}><span class="tab-ic">${I(t[2])}</span>${t[1]}</button>`).join('')}</nav>`;
}

function screen(cls, o){
  return `<div class="screen screen-${cls}">${backdrop}<div class="safe-top"></div><div class="screen-body">${o.body}</div>${o.action || ''}${o.tab ? tabBar(o.tab, o.st) : ''}${o.overlay || ''}</div>`;
}

function crowd(level){
  const map = {1:['Near-empty','warn'],2:['Steady crowd','ok'],3:['Busy','warn'],4:['Packed','danger']}[level];
  return `<span class="tag ${map[1]} crowd-tag"><span class="crowd-bars">${[1,2,3,4].map(i => `<i class="${i <= level ? 'on' : ''}"></i>`).join('')}</span>${map[0]}</span>`;
}

    const target = scr.querySelector(tour.dataset.target);
    if (!target) return;
    const sr = scr.getBoundingClientRect(), k = sr.width / scr.offsetWidth || 1;
    const tr = target.getBoundingClientRect();
    const pad = 6;
    const x = (tr.left - sr.left) / k - pad, yy = (tr.top - sr.top) / k - pad, w = tr.width / k + pad * 2, h = tr.height / k + pad * 2;
    const ring = tour.querySelector('.tour-ring'), card = tour.querySelector('.tour-card');
    Object.assign(ring.style, {left:x + 'px', top:yy + 'px', width:w + 'px', height:h + 'px'});
    const SW = scr.offsetWidth, SH = scr.offsetHeight;
    const cw = card.offsetWidth || 318, left = Math.max(16, Math.min(SW - 16 - cw, x + w / 2 - cw / 2));
    card.style.left = left + 'px';
    if (tour.dataset.place === 'above') { card.style.top = ''; card.style.bottom = (SH - yy + 14) + 'px'; }
    else { card.style.bottom = ''; card.style.top = (yy + h + 14) + 'px'; }
  });
}

function render(){
  mapN = 0;
  device.innerHTML = S[current](st);
  requestAnimationFrame(() => positionTours(device));
  bindHold();
  clearTimeout(splashTimer);
  if (current === 'splash') splashTimer = setTimeout(() => { if (current === 'splash') go('welcome', true); }, 2800);
}
/* Each screen change is a history entry, so the phone's own back gesture or button steps back through the prototype. */
function go(id, replace){
  if (!S[id]) return;
  current = id;
  try { history[replace ? 'replaceState' : 'pushState']({screen:id}, ''); } catch (e) {}
  render();
}
window.addEventListener('popstate', e => {
  const id = e.state && e.state.screen;
  if (id && S[id]) { current = id; render(); }
});

function toast(msg){
  const scr = device.querySelector('.screen');
  if (!scr) return;
  scr.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = I('check') + '<span>' + msg + '</span>';
  scr.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

function bindHold(){
  const btn = device.querySelector('#hold-000');
  if (!btn) return;
  let t = null;
  const start = e => { e.preventDefault(); btn.classList.add('holding'); t = setTimeout(() => { btn.classList.remove('holding'); toast('Preview only. In the full app, this would call 000.'); }, 1500); };
  const stop = () => { if (t) { clearTimeout(t); t = null; } btn.classList.remove('holding'); };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('contextmenu', e => e.preventDefault());
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) start(e); });
  btn.addEventListener('keyup', stop);
}

const ACTS = {
  'tour-start': () => { st.tourStep = 1; go('tour'); },
  'tour-next': () => { if (st.tourStep < 4) { st.tourStep++; render(); } else go('home'); },
  'pref': v => { st.pref = v; render(); },
  'start-trip': () => { st.tripActive = true; st.checkin = 'ask'; go('trip'); },
  'pick-contact': v => { st.contact = v; render(); },
  'duration': v => { st.duration = v; render(); },
  'confirm-share': () => { st.sharing = true; const n = CONTACTS[st.contact].n; go(st.tripActive ? 'trip' : 'route'); toast(n + ' can follow this trip until you arrive.'); },
  'stop-share': () => { st.sharing = false; render(); toast('Sharing stopped.'); },
  'checkin-fine': () => { st.checkin = 'fine'; render(); },
  'checkin-later': () => { st.checkin = 'fine'; go('trip'); toast("We'll check in again in 5 minutes."); },
  'move-car': () => { st.checkin = 'fine'; go('trip'); toast('Car 5 is just behind you. Nothing was reported.'); },
  'update-mum': () => toast('Mum now expects you home at 12:22.'),
  'leave-it': () => toast("Mum's arrival time wasn't changed."),
  'arrive': () => { st.tripActive = false; go('arrived'); },
  'confirm': v => { st.confirmed = v; render(); },
  'chip': v => { st.chip = v; render(); },
  'toggle': v => { st.toggles[v] = !st.toggles[v]; render(); },
  'rel': v => { st.rel = v; render(); },
  'save-contact': () => { if (!st.contacts.includes('priya')) st.contacts.push('priya'); go('profile'); toast('Priya is now a trusted contact.'); },
  'alert-mum': () => toast('Preview only. In the full app, Mum would get your location and a "need help" message.'),
  'silent': () => toast('Preview only. In the full app, your phone would buzz once to confirm.'),
  'filter': v => { st.filter = v; render(); },
  'cycle-pref': () => { const k = ['calmer','fastest','walk']; st.pref = k[(k.indexOf(st.pref) + 1) % k.length]; render(); },
  'cycle-checkin': () => { st.checkEvery = (st.checkEvery + 1) % CHECK_OPTS.length; render(); },
  'change-loc': () => toast('Preview only. In the full app, you could choose a different station.'),
  'swap': () => toast('Preview only. In the full app, this swaps your start and destination.'),
  'msg-elis': () => toast('Preview only. In the full app, this opens a message to Elis.'),
  'copy-code': () => { const done = () => toast('Location code copied.'); try { navigator.clipboard.writeText('LIV-204').then(done, done); } catch (e) { done(); } }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && device.contains(a)) { if (a.disabled) return; ACTS[a.dataset.act] && ACTS[a.dataset.act](a.dataset.v); return; }
  const g = e.target.closest('[data-go]');
  if (g && device.contains(g)) { if (g.disabled) return; go(g.dataset.go); }
});

window.addEventListener('resize', () => positionTours(device));
try { history.replaceState({screen:current}, ''); } catch (e) {}
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => positionTours(device));
})();
</script>
